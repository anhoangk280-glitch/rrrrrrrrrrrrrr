<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bánh sinh nhật 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#ffd8e1;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    font-family:"Fredoka","Baloo 2","Nunito","Segoe UI",Arial,sans-serif;
  }

  /* Khung trang: giữ đúng tỉ lệ 2.09:1 như cửa sổ trong video */
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 2.0902));
    height:min(calc(100vw / 2.0902), 100vh);
    overflow:hidden;
    container-type:size;
    background:radial-gradient(ellipse 80% 90% at 50% 36%, #ffeef5 0%, #ffe5ee 42%, #ffd9e2 100%);
    user-select:none;
    -webkit-user-select:none;
  }

  .title{
    position:absolute;left:50%;top:7.1%;
    transform:translate(-50%,-50%);
    font:600 2.9cqw/1 "Fredoka","Baloo 2","Nunito","Segoe UI",Arial,sans-serif;
    color:#4a1424;white-space:nowrap;z-index:3;
    opacity:0;transition:opacity .6s ease;
  }
  .title.show{opacity:1}

  /* ----- Bánh ----- */
  .cake{
    position:absolute;left:29.0%;top:13.2%;width:43.1%;
    aspect-ratio:512/460;
    z-index:2;cursor:pointer;
  }
  .cake img{
    display:block;width:100%;height:100%;
    opacity:0;transition:opacity .25s ease;
    pointer-events:none;
  }
  .cake.ready img{opacity:1}

  .flames{
    position:absolute;inset:0;opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .cake.ready .flames{opacity:1}
  .glow{
    position:absolute;width:9%;height:11%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,240,170,.9), rgba(255,205,100,.35) 55%, rgba(255,200,90,0) 100%);
    mix-blend-mode:screen;
    animation:flick 1.1s ease-in-out infinite alternate;
  }
  .glow:nth-child(2){animation-delay:-.3s}
  .glow:nth-child(3){animation-delay:-.6s}
  .glow:nth-child(4){animation-delay:-.2s}
  .glow:nth-child(5){animation-delay:-.8s}
  @keyframes flick{
    from{opacity:.45;transform:translate(-50%,-50%) scale(.92)}
    to  {opacity:.9; transform:translate(-50%,-50%) scale(1.08)}
  }

  .hint{
    position:absolute;left:50%;top:95.2%;
    transform:translate(-50%,-50%);
    font:400 1.05cqw/1 "Fredoka","Baloo 2","Nunito","Segoe UI",Arial,sans-serif;
    color:#ad8591;white-space:nowrap;z-index:3;
    opacity:0;transition:opacity .5s ease;pointer-events:none;
  }
  .hint.show{opacity:1}

  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

  /* ----- Popup lời chúc ----- */
  .overlay{
    position:absolute;inset:0;z-index:10;
    background:rgba(20,8,15,.6);
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}

  .popup{
    position:absolute;left:50%;top:49.8%;
    width:42.1cqw;height:18.5cqw;
    transform:translate(-50%,-50%) scale(.9);
    opacity:0;
    background:#fffafc;border-radius:1.6cqw;
    box-shadow:0 1cqw 3cqw rgba(0,0,0,.25);
    transition:transform .35s cubic-bezier(.2,1.3,.4,1), opacity .3s ease;
  }
  .overlay.show .popup{transform:translate(-50%,-50%) scale(1);opacity:1}

  .p-title{
    position:absolute;left:0;right:0;top:17.9%;
    transform:translateY(-50%);
    text-align:center;white-space:nowrap;
    font:600 1.7cqw/1 "Fredoka","Baloo 2","Nunito","Segoe UI",Arial,sans-serif;
    color:#56303d;
  }
  .p-body{
    position:absolute;left:4.5%;right:4.5%;top:28.6%;
    text-align:center;white-space:pre-line;
    font:400 1.2cqw/2.05cqw "Fredoka","Baloo 2","Nunito","Segoe UI",Arial,sans-serif;
    color:#6b4b57;
    min-height:6.2cqw;
  }
  .p-btn{
    position:absolute;left:50%;top:80.2%;
    transform:translate(-50%,-50%);
    width:7.1cqw;height:3.3cqw;
    border:0;border-radius:999px;
    background:#f5484d;color:#fff;
    font:600 1.2cqw/1 "Fredoka","Baloo 2","Nunito","Segoe UI",Arial,sans-serif;
    box-shadow:0 .4cqw 1cqw rgba(245,72,77,.35);
    cursor:pointer;
  }
</style>
</head>
<body>

<div id="stage">
  <audio id="birthdayMusic" loop preload="auto">
    <source src="nhac-sinh-nhat.mp3" type="audio/mpeg">
  </audio>
  <div class="title" id="title">Chúc mừng sinh nhật!</div>

  <div class="cake" id="cake" title="Chạm vào bánh để thổi nến">
    <img id="cakeImg" alt="Bánh sinh nhật">
    <div class="flames">
      <span class="glow" style="left:40.7%;top:18.3%"></span>
      <span class="glow" style="left:45.4%;top:14.5%"></span>
      <span class="glow" style="left:48.3%;top:21.2%"></span>
      <span class="glow" style="left:55.4%;top:16.3%"></span>
      <span class="glow" style="left:58.2%;top:17.8%"></span>
    </div>
  </div>
  <div class="hint" id="hint">Chạm vào bánh để thổi nến.</div>

  <canvas id="fx"></canvas>

  <div class="overlay" id="overlay">
    <div class="popup">
      <div class="p-title">Chúc mừng sinh nhật!</div>
      <div class="p-body" id="pBody"></div>
      <button class="p-btn" id="pBtn">Đóng</button>
    </div>
  </div>
</div>

<script>
// Nhạc sinh nhật: thử tự phát khi mở trang.
const birthdayMusic = document.getElementById('birthdayMusic');
birthdayMusic.volume = 0.7;

function startBirthdayMusic() {
  if (!birthdayMusic || !birthdayMusic.paused) return;
  birthdayMusic.play().catch(() => {
    // Trình duyệt có thể chặn tự phát; sẽ thử lại sau thao tác đầu tiên.
  });
}

window.addEventListener('load', startBirthdayMusic);
document.addEventListener('pointerdown', startBirthdayMusic, { once: true });
document.addEventListener('keydown', startBirthdayMusic, { once: true });

const BODY = "Chúc Hiển tuổi mới tiền nhiều như lá, tình yêu đẹp như mơ, ăn mãi không béo, ngủ mãi không già, làm chơi mà tiền về đầy túi. Chúc Hiển bớt báo đời, bớt báo nhà, nhưng độ đẹp trai thì cứ tăng đều theo năm tháng. 😂
Đặc biệt, chúc Hiển luôn đúng như cái tên: Hiển nhiên là phải giàu, Hiển nhiên là phải đẹp trai, Hiển nhiên là luôn gặp may mắn! 🤣🎉";
const SAMPLE_STEP = 4;

const $ = id => document.getElementById(id);
const stage = $('stage'), cake = $('cake'), cakeImg = $('cakeImg'), fx = $('fx');
const title = $('title'), hint = $('hint'), overlay = $('overlay');
const pBody = $('pBody'), pBtn = $('pBtn');
const ctx = fx.getContext('2d');

let state = 'init';
let cakePts = [];
let cakeCols = 1;
let fxParts = [];
let fxRAF = 0;
let typeTimer = null;

cakeImg.src = IMG.cake;

/* ---------- Canvas hạt bụi ---------- */
function resizeFx(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = Math.round(stage.clientWidth * dpr);
  fx.height = Math.round(stage.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function clearFx(){
  ctx.clearRect(0, 0, stage.clientWidth, stage.clientHeight);
}
function runFx(dur, draw, done){
  cancelAnimationFrame(fxRAF);
  const t0 = performance.now();
  const loop = now => {
    const t = (now - t0) / 1000;
    draw(t);
    if (t < dur) fxRAF = requestAnimationFrame(loop);
    else if (done) done();
  };
  fxRAF = requestAnimationFrame(loop);
}
function ease(k){ return k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; }
function gauss(){
  let u = 0; while (u === 0) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
}
function getBox(){
  const s = stage.getBoundingClientRect(), c = cake.getBoundingClientRect();
  return { x:(c.left - s.left)/s.width, y:(c.top - s.top)/s.height, w:c.width/s.width, h:c.height/s.height };
}
function dotSize(){
  const b = getBox();
  return Math.max(1.5, b.w * stage.clientWidth / cakeCols * 1.15);
}

/* Lấy các điểm ảnh của bánh (bỏ phần trong suốt) */
function sampleCake(){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, w, h).data;
      const pts = [];
      for (let y = 0; y < h; y += SAMPLE_STEP){
        for (let px = 0; px < w; px += SAMPLE_STEP){
          const i = (y * w + px) * 4;
          const a = d[i + 3];
          if (a < 60) continue;
          pts.push({ u: px / w, v: y / h, c: d[i] + ',' + d[i+1] + ',' + d[i+2], a: a / 255 });
        }
      }
      cakeCols = Math.ceil(w / SAMPLE_STEP);
      resolve(pts);
    };
    img.src = IMG.cake;
  });
}

/* ---------- Hình thành bánh từ bụi ---------- */
function makeForming(){
  const b = getBox();
  return cakePts.map(p => {
    const cloud = Math.random() < 0.9;
    return {
      tx: b.x + p.u * b.w,
      ty: b.y + p.v * b.h,
      sx: cloud ? b.x + b.w/2 + gauss() * 0.05 : Math.random(),
      sy: cloud ? b.y + b.h/2 + gauss() * 0.08 : Math.random(),
      c: p.c, a: p.a,
      a0: cloud ? 0.5 : 0.25,
      d: Math.random() * 0.5,
      du: 1.0 + Math.random() * 0.4
    };
  });
}
function drawForm(t){
  const W = stage.clientWidth, H = stage.clientHeight;
  ctx.clearRect(0, 0, W, H);
  const sz = dotSize();
  for (const p of fxParts){
    const k = (t - p.d) / p.du;
    let x, y, al;
    if (k <= 0){ x = p.sx*W; y = p.sy*H; al = p.a0*p.a; }
    else if (k >= 1){ x = p.tx*W; y = p.ty*H; al = p.a; }
    else {
      const e = ease(k);
      x = (p.sx + (p.tx - p.sx)*e) * W;
      y = (p.sy + (p.ty - p.sy)*e) * H;
      al = (p.a0 + (1 - p.a0)*e) * p.a;
    }
    ctx.fillStyle = 'rgba(' + p.c + ',' + al + ')';
    ctx.fillRect(x - sz/2, y - sz/2, sz, sz);
  }
}

/* ---------- Bánh tan thành bụi khi thổi nến ---------- */
function makeScatter(){
  const b = getBox();
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  return cakePts.map(p => {
    const tx = b.x + p.u * b.w, ty = b.y + p.v * b.h;
    return {
      tx, ty,
      vx: (tx - cx) * 0.45 + gauss() * 0.03,
      vy: (ty - cy) * 0.2 - 0.05 - Math.random() * 0.22,
      c: p.c, a: p.a,
      d: Math.random() * 0.25,
      life: 1.4 + Math.random() * 0.9
    };
  });
}
function drawScatter(t){
  const W = stage.clientWidth, H = stage.clientHeight;
  ctx.clearRect(0, 0, W, H);
  const sz = dotSize();
  for (const p of fxParts){
    const k = t - p.d;
    if (k < 0){
      ctx.fillStyle = 'rgba(' + p.c + ',' + p.a + ')';
      ctx.fillRect(p.tx*W - sz/2, p.ty*H - sz/2, sz, sz);
      continue;
    }
    const al = p.a * Math.pow(Math.max(0, 1 - k / p.life), 0.7);
    if (al <= 0) continue;
    const x = (p.tx + p.vx*k) * W, y = (p.ty + p.vy*k) * H;
    ctx.fillStyle = 'rgba(' + p.c + ',' + al + ')';
    ctx.fillRect(x - sz/2, y - sz/2, sz, sz);
  }
}

/* ---------- Trạng thái: bánh hình thành ---------- */
function startForming(){
  state = 'forming';
  cake.classList.remove('ready');
  title.classList.remove('show');
  hint.classList.remove('show');
  fxParts = makeForming();
  runFx(2.0, drawForm, () => {
    cake.classList.add('ready');
    title.classList.add('show');
    hint.classList.add('show');
    setTimeout(clearFx, 300);
    state = 'cake';
  });
}

/* ---------- Thổi nến ---------- */
cake.addEventListener('click', () => {
  startBirthdayMusic();
  if (state !== 'cake') return;
  state = 'blowing';
  cake.classList.remove('ready');
  hint.classList.remove('show');
  title.classList.remove('show');
  fxParts = makeScatter();
  runFx(2.6, drawScatter, clearFx);
  setTimeout(openPopup, 1800);
});

/* ---------- Popup lời chúc ---------- */
function openPopup(){
  if (state !== 'blowing') return;
  state = 'popup';
  overlay.classList.add('show');
  pBody.textContent = '';
  clearInterval(typeTimer);
  setTimeout(() => {
    if (state !== 'popup') return;
    let i = 0;
    typeTimer = setInterval(() => {
      i++;
      pBody.textContent = BODY.slice(0, i);
      if (i >= BODY.length) clearInterval(typeTimer);
    }, 12);
  }, 250);
}
pBtn.addEventListener('click', () => {
  if (state !== 'popup') return;
  clearInterval(typeTimer);
  overlay.classList.remove('show');
  state = 'resetting';
  setTimeout(startForming, 300);
});

/* ---------- Khởi tạo ---------- */
window.addEventListener('resize', resizeFx);
resizeFx();
sampleCake().then(pts => {
  cakePts = pts;
  startForming();
});
</script>
